<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <pattern id="glass" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H14M0 7H14" stroke="#a3bcc8" stroke-width="1"/></pattern>
    <pattern id="dash" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0L12 12" stroke="#a7aeb1" stroke-width="2"/></pattern>
    <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#21343e}.title{font-size:30px;font-weight:700}.label{font-size:22px;font-weight:600}.note{font-size:18px;fill:#52636b}.outline{stroke:#274350;stroke-width:5;stroke-linejoin:round}.fine{fill:none;stroke:#91acb8;stroke-width:3}.leader{fill:none;stroke:#52636b;stroke-width:2.5;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52636b"/></marker>
  </defs>
  <rect width="1200" height="760" fill="white"/>
  <text x="60" y="60" class="title">绿峰中心 · 修正俯视示意</text>
  <text x="60" y="92" class="note">三栋主体：两栋后排塔楼＋一栋连续的前排低层；通道位置按照片推定，非测绘图</text>
  <!-- Rear tower A: chamfered inner/front corner -->
  <path class="outline" fill="#dce8ed" d="M127 149 Q127 126 150 126 H474 Q497 126 497 149 V373 L465 407 H150 Q127 407 127 384 Z"/>
  <path fill="url(#glass)" d="M137 149 Q137 136 150 136 H474 Q487 136 487 149 V370 L461 397 H150 Q137 397 137 384 Z"/>
  <path class="fine" d="M155 154H469V368H155Z"/>
  <text x="248" y="277" class="label">A 左塔楼</text>
  <!-- Rear tower B: asymmetric inner/front chamfer -->
  <path class="outline" fill="#dce8ed" d="M706 149 Q706 126 729 126 H1049 Q1072 126 1072 149 V384 Q1072 407 1049 407 H741 L706 370 Z"/>
  <path fill="url(#glass)" d="M716 149 Q716 136 729 136 H1049 Q1062 136 1062 149 V384 Q1062 397 1049 397 H745 L716 367 Z"/>
  <path class="fine" d="M740 154H1044V368H740Z"/>
  <text x="831" y="277" class="label">B 右塔楼</text>
  <!-- Trapezoidal ground corridor, deliberately shown above podium roof as dashed projection -->
  <path d="M497 368 L706 368 L752 616 L445 616 Z" fill="url(#dash)" opacity="0.65" stroke="#9b6c4e" stroke-width="4" stroke-dasharray="12 9"/>
  <!-- Exactly one continuous front podium -->
  <path class="outline" fill="#cedee5" d="M115 445 Q115 425 135 425 H1065 Q1085 425 1085 445 V616 Q1085 640 1061 640 H139 Q115 640 115 616 Z"/>
  <path d="M137 449 H1063 V615 H137 Z" fill="url(#glass)" stroke="#8faab6" stroke-width="3"/>
  <path class="fine" d="M165 474H1035V586H165Z"/>
  <path d="M470 425 H730 V640 H470 Z" fill="url(#dash)" opacity="0.45" stroke="#9b6c4e" stroke-width="4" stroke-dasharray="12 9"/>
  <text x="210" y="542" class="label">C 连续前排低层建筑</text>
  <text x="479" y="668" class="note">梯形地面通道（上方有连桥/屋面）</text>
  <path class="leader" d="M620 645L601 580"/>
  <text x="52" y="710" class="note">前方 / 紫金科创方向 ↓</text>
  <text x="850" y="710" class="note">虚线和斜线：地面通道的投影</text>
</svg>
